name: Runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the core package
        run: python -m pip install .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check installed commands
        run: |
          lumos-runtime --help
          lumos-runtime inspect
          lumos-runtime plan-startup-alignment examples/startup-calibration.example.json --operator-deg 2 0 0 0 0 -4
  wrist-projection:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python -m pip install '.[simulation]'
      - name: Verify wrist camera projection
        run: python -m unittest discover -s tests -p test_wrist_camera.py -v
