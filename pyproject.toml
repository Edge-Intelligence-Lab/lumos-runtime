[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-runtime"
version = "0.1.0"
description = "Read-only device inspection, startup alignment preview, and simulation for Lumos Touch R1"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
simulation = ["mujoco==4.0.1", "pillow"]

[project.scripts]
lumos-runtime = "lumos_runtime.cli:main"

[project.urls]
Repository = "https://github.com/Edge-Intelligence-Lab/lumos-edge-runtime"
Documentation = "https://github.com/Edge-Intelligence-Lab/lumos-edge-runtime/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lumos_runtime.simulation" = ["*.xml", "*.json"]
